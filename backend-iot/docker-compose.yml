services:
  postgres:
    image: postgres:16-alpine
    container_name: backend-iot-postgres
    # Không tự chạy lại sau khi tắt/bật máy — chỉ start khi bạn chạy: docker compose up -d
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
